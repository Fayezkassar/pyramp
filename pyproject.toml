[project]
name = "pyramp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fayez Kassar", email = "fayezkas@hotmail.co.uk" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pyramp = "pyramp:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"